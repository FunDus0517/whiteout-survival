<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美术检查 · 余烬</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#253e4b;font:13px -apple-system,sans-serif}canvas{display:block;width:100%;height:100%}nav{position:fixed;top:14px;left:14px;display:flex;gap:6px}button{min-height:44px;background:#203942e6;color:#e4eee8;border:1px solid #edf6f32b;border-radius:12px;padding:0 16px}output{position:fixed;bottom:15px;left:20px;background:#233e45e6;color:#e4eee8;border-radius:9px;padding:8px 12px}</style>
<canvas aria-label="可操作场景美术预览"></canvas><nav><button data-mode="outside">房屋外部</button><button data-mode="inside">房间内部</button><button data-mode="base">基地内部</button></nav><output>美术检查 · 不读写任何存档</output>
<script src="../world-v3-data.js"></script><script src="../world-data.js"></script><script src="../arena-model.js"></script><script src="../actor-volume.js"></script><script src="../building-volume.js"></script><script src="../world-art-v3.js"></script><script src="../world-art.js"></script><script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let run,art,ready=false,mode='outside';
async function select(next){ready=false;mode=next;if(art)art.dispose();run=Expedition.create({camp:next==='base',seed:44});const b=WhiteoutWorld.BUILDINGS[9];Object.assign(run.player,next==='base'?{x:740,y:398}:next==='inside'?{x:b.x+b.w/2,y:b.y+b.h*.59}:{x:b.x+b.w/2,y:b.y+b.h+62});art=WhiteoutArt.create(run);await art.ready;ready=true;document.querySelector('output').textContent='美术检查 · '+(next==='base'?'基地':next==='inside'?'室内':'室外')+' · 不读写任何存档';}
document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.mode)select(e.target.dataset.mode);});
function draw(t){if(ready){canvas.width=innerWidth;canvas.height=innerHeight;c.setTransform(1,0,0,1,0,0);const z=mode==='base'?1.1:1.25;c.scale(z,z);c.translate(innerWidth/z/2-run.player.x,innerHeight/z/2-run.player.y+45);const b={x:run.player.x-innerWidth/z/2,y:run.player.y-innerHeight/z/2-45,w:innerWidth/z,h:innerHeight/z};art.drawGround(c,b);
const layers=art.structures.filter(s=>s.x<b.x+b.w+190&&s.x+(s.w||90)>b.x-190&&s.y<b.y+b.h+250&&s.sortY>b.y-250).map(s=>({y:s.sortY,draw:()=>art.drawStructure(c,s)}));
run.nodes.filter(n=>Math.abs(n.x-run.player.x)<innerWidth/z&&Math.abs(n.y-run.player.y)<innerHeight/z).forEach(n=>layers.push({y:n.y,draw:()=>art.drawNode(c,n,t,false)}));layers.push({y:run.player.y,draw:()=>art.drawActor(c,{...run.player,moving:true},'player',t)});layers.sort((a,b)=>a.y-b.y).forEach(v=>v.draw());}requestAnimationFrame(draw);}select('outside');requestAnimationFrame(draw);
</script></html>
